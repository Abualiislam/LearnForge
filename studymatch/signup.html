<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — LearnForge StudyMatch</title>
    <link rel="stylesheet" href="css/studymatch.css">
</head>
<body>

<header class="sm-header">
    <a href="../index.html" class="sm-logo">LearnForge</a>

    <nav>
        <a href="index.html">StudyMatch</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="sm-auth-page">
    <section class="sm-auth-card">
        <span class="sm-badge">STUDYMATCH</span>

        <h1>Create your account</h1>

        <p class="sm-auth-intro">
            Join StudyMatch and find students who share your study goals.
        </p>

        <form id="signupForm" novalidate>
            <label for="signupEmail">Email</label>
            <input
                id="signupEmail"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >

            <label for="signupPassword">Password</label>
            <input
                id="signupPassword"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="At least 8 characters"
                required
            >

            <label for="signupPasswordConfirm">Confirm password</label>
            <input
                id="signupPasswordConfirm"
                name="passwordConfirm"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Enter your password again"
                required
            >

            <button type="submit" class="sm-btn sm-btn-primary sm-auth-submit">
                Create Account
            </button>

            <p id="signupMessage" class="sm-form-message" role="status"></p>
        </form>

        <p class="sm-auth-switch">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>
    </section>
</main>

<footer class="sm-footer">
    <p>© 2026 LearnForge. Study smarter, together.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
